#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw

write_files:
  - path: /usr/local/bin/witness-reference-install.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail

      export DEBIAN_FRONTEND=noninteractive

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      if ! swapon --show | grep -q /swapfile; then
        fallocate -l 1G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo "/swapfile none swap sw 0 0" >> /etc/fstab
      fi

      ufw default deny incoming
      ufw default allow outgoing
      ufw allow OpenSSH
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw --force enable

      mkdir -p /opt/witness
      if [ ! -d /opt/witness/.git ]; then
        git clone https://github.com/ChrisBrooksbank/witness.git /opt/witness
      fi
      cd /opt/witness
      git fetch --all --prune
      git checkout main
      git pull --ff-only

      cat > /opt/witness/.env <<ENV
      WITNESS_SERVER_NAME=__WITNESS_SERVER_NAME__
      WITNESS_DATA_DIR=./data
      WITNESS_ADDR=:8080
      COMPOSE_PROFILES=https
      ENV

      mkdir -p /opt/witness/data
      docker compose up -d --build

      cat > /etc/systemd/system/witness-reference-update.service <<SERVICE
      [Unit]
      Description=Update and restart Witness reference server
      Wants=network-online.target
      After=network-online.target docker.service

      [Service]
      Type=oneshot
      WorkingDirectory=/opt/witness
      ExecStart=/usr/bin/git pull --ff-only
      ExecStart=/usr/bin/docker compose up -d --build
      SERVICE

      systemctl daemon-reload

runcmd:
  - /usr/local/bin/witness-reference-install.sh

final_message: "Witness reference server bootstrap complete. Check /var/log/cloud-init-output.log for details."
